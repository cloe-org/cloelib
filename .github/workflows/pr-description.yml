name: PR Description
on:
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize
      - ready_for_review
permissions:
  contents: read
jobs:
  check-description:
    name: Check PR description
    runs-on: ubuntu-latest
    # Bot PRs (All Contributors, dependabot, ...) do not use the PR template.
    if: github.event.pull_request.user.type != 'Bot'
    steps:
      - uses: actions/checkout@v4
      - name: Check required items in the PR description
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 .github/scripts/check_pr_description.py
