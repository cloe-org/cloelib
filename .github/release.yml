name: 🚀 cloelib Release: ${{ steps.extract_tag.outputs.version }}

body: |
  This release introduces **[insert short summary or goal here]**.

  ### ✨ What's New
  - 🌌 **Cosmological Features** — *[Add description of new cosmology capabilities]*
  - 🐍 **Python Enhancements** — *[Add Python-specific updates or interface improvements]*
  - 🔧 **Integration Tools** — *[Mention updates for integration with other tools/pipelines]*
  - 📊 **`cloelike` Module** — *[List updates or additions to work with the likelihood engine]*  
  - 📈 **Playground Environment** — *[Describe new interactive tools or tutorials/examples]*
  - ⚡️ **JAX Support** — *[Note new or experimental support for accelerated backends]*

  ### 🛠️ Bug Fixes
  - 🔧 *[Summarize any notable bug fixes or technical cleanups]*

  ### 📄 Full Changelog
  For a complete list of changes, see the [compare view](https://github.com/cloe-org/cloelib/compare/${{ steps.extract_previous_tag.outputs.previous }}...${{ steps.extract_tag.outputs.version }}).

