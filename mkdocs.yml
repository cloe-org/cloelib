site_name: cloelib
site_description: The Library for the Cosmology Likelihood for Observables in Euclid
site_author: cloe-org
site_url: https://cloe-org.github.io/cloelib/dev/

repo_name: cloe-org/cloelib
repo_url: https://github.com/cloe-org/cloelib
edit_uri: https://github.com/cloe-org/cloelib/docs

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.footer
    - navigation.instant.preview
    - navigation.path
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
      navigation.top
    - navigation.tracking
    - content.code.copy

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: 
          options:
            docstring_style: google        # Use Google-style docstrings
            show_source: false
            show_signature: true          # Show function/method signatures
            show_root_heading: false      # Avoid duplicate top-level heading
            show_root_members: false
            heading_level: 2              
            members_order: source         # could be alphabetical
            merge_init_into_class: true   # Include __init__ docstrings in class
            show_submodules: true         # Display the submodules

            show_type_annotations: true   # Show type hints in signatures
            show_signature_type_parameters: true
            parameter_headings: true
            type_parameter_headings: true
            separate_signature: true
            show_root_toc_entry: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            show_root_full_path: false
            summary: false
            backlinks: tree
            docstring_options:
              ignore_init_summary: true
            docstring_section_style: list
            filters: public
            inherited_members: true
            line_length: 88
            preload_modules: [mkdocstrings]
            relative_crossrefs: true
            scoped_crossrefs: true
            show_bases: false
            show_inheritance_diagram: true
            show_signature_annotations: true
            signature_crossrefs: true
            unwrap_annotated: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - toc:
      toc_depth: 3
      permalink: true
  - pymdownx.arithmatex:
      generic: true

extra:
  version:
    provider: mike
    default: stable

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
  
nav:
  - Home: index.md
  - API Reference: api.md

copyright: Copyright 2025 cloe-org

