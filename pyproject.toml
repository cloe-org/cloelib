[tool.poetry]
name = "cloelib"
version = "0.7.1"
description = "cloelib is a flexible and efficient library designed to compute cosmological observables for CLOE (Cosmology Likelihood for Observables in Euclid)"
authors = [
    "M. Bonici <marco.bonici@uwaterloo.ca>",
    "G. Cañas-Herrera <guadalupe.canasherrera@esa.int>",
    "P. Carrilho <pedro.carrilho@ed.ac.uk>",
    "S. Casas <casas@physik.rwth-aachen.de>",
    "C. Moretti <cmoretti@sissa.it>",
    "A. Pezzotta <andrea.pezzotta@inaf.it>"
]
license = "LGPL-3.0"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
interpax = "0.3.3"
jax = "0.4.38"
numpy = "<2.0"
quadax = "0.2.7"
scipy = "<1.14"
seaborn = "*"

[tool.poetry.extras]
cosmo = ["camb", "astropy"]
emulators = ["HMcode2020Emu", "comet-emu", "tensorflow"]
euclid = ["euclidlib"]

[tool.poetry.dependencies.tensorflow]
version = "==2.13"
optional = true

[tool.poetry.dependencies.HMcode2020Emu]
git = "https://github.com/MariaTsedrik/HMcode2020Emu.git"
optional = true

[tool.poetry.dependencies.comet-emu]
git = "https://gitlab.com/aegge/comet-emu.git"
branch = "test_lib"
optional = true

[tool.poetry.dependencies.camb]
version="1.5.7"
optional=true

[tool.poetry.dependencies.astropy]
version="*"
optional=true

[tool.poetry.dependencies.euclidlib]
version="*"
optional=true


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
