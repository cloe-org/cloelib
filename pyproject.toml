[tool.poetry]
name = "cloelib"
version = "0.7.0"
description = "cloelib is a flexible and efficient library designed to compute cosmological observables for CLOE (Cosmology Likelihood for Observables in Euclid)"
authors = [
    "M. Bonici <marco.bonici@uwaterloo.ca>",
    "G. Cañas-Herrera <guadalupe.canasherrera@esa.int>",
    "P. Carrilho <pedro.carrilho@ed.ac.uk>",
    "C. Moretti <cmoretti@sissa.it>",
    "A. Pezzotta <andrea.pezzotta@inaf.it>"
]
license = "LGPL-3.0"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.8"
interpax = "0.3.3"
jax = "0.4.30"
numpy = "^2.0"
quadax = "0.2.7"
scipy = "<1.14"

[tool.poetry.extras]
camb = ["camb"]
hmcode2020emu = ["HMcode2020Emu"]
comet-emu = ["comet-emu"]

[tool.poetry.dependencies.HMcode2020Emu]
git = "https://github.com/MariaTsedrik/HMcode2020Emu.git"

[tool.poetry.dependencies.comet-emu]
git = "https://gitlab.com/aegge/comet-emu.git"
branch = "test_lib"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
