name: Docs

on:
  push:
    branches:
      - main
    tags:
      - "v*" # Tags update 'stable' and version numbers
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-docs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenblas-dev gfortran

      - name: Install MkDocs and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "pymdown-extensions<12.2" mkdocs-material mkdocstrings[python] mike
          pip install -e .

      - name: Fetch gh-pages history
        run: git fetch origin gh-pages --depth=1 || true

      - name: Configure git author
        run: |
          git config --local user.name  "${{ github.actor }}"
          git config --local user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"

      - name: Verify Docs Build (Dry Run)
        if: github.event_name == 'pull_request'
        run: mkdocs build --strict

      # Reviewers can preview the built site of a PR without building it locally:
      # open the workflow run of this PR (Checks tab -> Docs), scroll to "Artifacts"
      # and download "docs-site-pr-<PR number>". See docs/contributing.md.
      # Only the static site is uploaded; this step is skipped if the build failed.
      - name: Upload built docs as PR artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v5
        with:
          name: docs-site-pr-${{ github.event.pull_request.number }}
          path: site/
          if-no-files-found: error
          retention-days: 14

      # Deploy only on Push
      # This runs ONLY on Pushes (merges to main or tags).
      # It is skipped entirely for PRs.
      - name: Deploy documentation
        if: github.event_name == 'push'
        run: |
          # Your deployment logic (using the tag/main logic discussed before)
          if [[ $GITHUB_REF == refs/tags/* ]]; then
             VERSION="${GITHUB_REF#refs/tags/}"
             mike deploy --push --update-aliases $VERSION stable
             mike set-default --push stable
          elif [[ $GITHUB_REF == refs/heads/main ]]; then
             mike deploy --push --update-aliases dev latest
          fi
