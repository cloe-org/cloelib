site_name: cloelib
site_description: The Library for the Cosmology Likelihood for Observables in Euclid
site_author: cloe-org
site_url: https://cloe-org.github.io/cloelib/dev/

repo_name: cloe-org/cloelib
repo_url: https://github.com/cloe-org/cloelib
edit_uri: https://github.com/cloe-org/cloelib/docs

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.sections
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google        # Use Google-style docstrings
            show_source: false
            show_signature: true          # Show function/method signatures
            show_root_heading: false      # Avoid duplicate top-level heading
            heading_level: 2              
            members_order: source         # could be alphabetical
            merge_init_into_class: true   # Include __init__ docstrings in class
            show_submodules: true         # Display the submodules
            filters: public                
            show_type_annotations: true   # Show type hints in signatures
            show_signature_type_parameters: true
            parameter_headings: true
            type_parameter_headings: true
            separate_signature: true
            show_root_toc_entry: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            show_root_full_path: false
            summary: true


markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - toc:
      permalink: true
      toc_depth: 2

extra:
  version:
    provider: mike
    default: stable

nav:
  - Home: index.md
  - API Reference: api.md

copyright: Copyright 2025 cloe-org
