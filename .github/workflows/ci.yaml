name: CI
on:
  push:
  pull_request:
    branches:
      - main
env:
  ENV_NAME: cloe-org-env
  ENV_FILE: cloe-org-environments/environments/cloe-org-env-linux-v2026.2.yaml
jobs:
  style:
    name: Style (pre-commit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pre-commit
        run: python -m pip install pre-commit
      - name: Run pre-commit checks
        run: pre-commit run --all-files --show-diff-on-failure
  tests:
    name: Tests
    runs-on: ubuntu-latest
    needs: style
    strategy:
      fail-fast: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Checkout cloe-org-environments
        uses: actions/checkout@v4
        with:
          repository: cloe-org/cloe-org-environments
          ref: env-v2026.2
          path: cloe-org-environments
      - name: Setup Mambaforge
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-variant: Miniforge3
          miniforge-version: latest
          activate-environment: ${{ env.ENV_NAME }}
          environment-file: ${{ env.ENV_FILE }}
          use-mamba: true
      - name: Install cloelib and extras from pyproject.toml
        run: |
          # MGCLASS 2.9.4.5 contains legacy C declarations. Use the system
          # compiler (GNU C17) while retaining the Mamba environment's Python.
          ENV_PREFIX="$(mamba run -n "$ENV_NAME" python -c 'import sys; print(sys.prefix)')"
          TOOLCHAIN_DIR="$RUNNER_TEMP/mgclass-toolchain"
          mkdir -p "$TOOLCHAIN_DIR"
          cat > "$TOOLCHAIN_DIR/gcc" <<'EOF'
          #!/bin/sh
          exec /usr/bin/gcc -std=gnu17 "$@"
          EOF
          chmod +x "$TOOLCHAIN_DIR/gcc"
          export PATH="$TOOLCHAIN_DIR:/usr/bin:/bin:${ENV_PREFIX}/bin:${PATH}"
          export PKG_CONFIG_PATH="${ENV_PREFIX}/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          mamba run -n "$ENV_NAME" python -m pip install --upgrade pip
          mamba run -n "$ENV_NAME" python -m pip install \
            ".[camb,classy,euclidemu2,baccoemu,emantis,react,hiclassy,mgclassy]"
      - name: Run tests
        run: mamba run -n $ENV_NAME python -m pytest
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build package
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m build
