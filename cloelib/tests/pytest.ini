[tool:pytest]
markers =
    camb: mark test to run only with CAMB backend
    class: mark test to run only with CLASS backend
    jax: mark test to run only with JAX backend

# Default pytest options
addopts = -v --tb=short --strict-markers

# Test discovery patterns
testpaths = .
python_files = test_*.py
python_functions = test_*
python_classes = Test*

# Output formatting
console_output_style = progress