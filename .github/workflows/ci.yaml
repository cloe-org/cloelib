name: CI

on:
  push:
  pull_request:
    branches:
      - main

jobs:
  run-tests:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install external prereq using pip
        run: |
          pip install camb jax classy

      - name: Install dependencies
        run: |
            python -m pip install .
            pip install pyinstrument

      - name: Install camb
        run: python -m pip install camb

      - name: Install classy
        run: python -m pip install classy

      - name: Run tests
        run: pytest

      - name: Run mypy
        run: mypy

