name: CI

on:
  push:
  pull_request:
    branches:
      - main

jobs:
  run-tests:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install external prereq using pip
        run: |
          pip install camb jax classy==3.3.1

      - name: Install dependencies
        run: |
          python -m pip install .
          pip install pyinstrument

      - name: Install camb
        run: python -m pip install camb

      - name: Install classy
        run: python -m pip install classy==3.3.1

      - name: Run tests
        run: pytest

      - name: Run mypy
        run: mypy
        
      - name: Install pre-commit
        run: |
          pip install pre-commit
          pre-commit install

      - name: Run pre-commit checks (format + lint)
        run: pre-commit run --all-files --show-diff-on-failure

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: pipx run build

      - name: Install pre-commit
        run: |
          pip install pre-commit
          pre-commit run --all-files --show-diff-on-failure